<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelX</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-sans text-gray-800 bg-white">

    <header class="bg-white py-5 px-8 flex items-center justify-between sticky   ">
        <a class="text-2xl font-bold text-blue-600" href="">TravelX</a>

        <nav>
            <ul class="flex items-center gap-8  font-medium text-gray-700">
                <li><a href="">Home</a></li>
                <li><a href="">Destinations</a></li>
                <li><a href="">Packages</a></li>
                <li><a href="">Gallery</a></li>
                <li><a href="">Contact</a></li>
            </ul>
        </nav>
        <button>Book Now</button>

    </header>

    <div class="bg-blue-600 text-white py-16 px-8">
        <div class="max-w-7xl  grid grid-cols-2 gap-12 items-center">

            <div>
                <h1 class="text-4xl font-bold leading-tight">
                    Explore the World With <br> Amazing Tours
                </h1>

                <p class="text-blue-100 text-base max-w-md leading-relaxed">
                    Book unforgettable vacations at affordable prices.
                    Travel comfortably with our experienced guides.
                </p>
                <br>

                <div class="flex items-center gap-6">
                    <button class=" box-content bg-white text-blue-600 box-border-4 px-[9px] py-[5px] rounded-[5px] ">Explore</button>
                    <button class="bg-transparent border border-white text-white px-[9px] py-[5px] rounded-[5px]">Learn More</button>
                </div>
            </div>

            <div>
                <img class="rounded-2.1 border border-blue-600 rounded-[10px]"
                    src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800"
                    alt="">
            </div>

        </div>
    </div>

</body>
</html>
